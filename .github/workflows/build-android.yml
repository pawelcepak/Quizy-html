name: Build Android Keyboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout custom project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone AnySoftKeyboard
        run: |
          git clone https://github.com/AnySoftKeyboard/AnySoftKeyboard.git upstream
          cd upstream
          git checkout 0f4cc6f09ffe39d1a7a943d5644d67803f6c2658

      - name: Apply custom Polish speed layout
        run: |
          cp config/polish_speed.xml upstream/addons/languages/polish/pack/src/main/res/xml/polish_qwerty.xml

      - name: Build APK
        working-directory: upstream
        run: ./gradlew :ime:app:assembleAllAddOns --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find upstream/ime/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" dist/SzybkaKlawiatura-v0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SzybkaKlawiatura-v0.1-APK
          path: dist/SzybkaKlawiatura-v0.1-debug.apk
          if-no-files-found: error
